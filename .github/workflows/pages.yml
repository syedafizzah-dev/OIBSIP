name: Deploy OIBSIP Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site/lumora
          mkdir -p _site/portfolio

          cp -r Web-Development-Level-1-Landing-Page/LUMORA/* _site/lumora/
          cp -r WebDev-L1-PersonalPortfolio/* _site/portfolio/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>OIBSIP Projects</title>
          </head>
          <body>
            <h1>OIBSIP Web Development & Designing Internship</h1>
            <p><a href="./lumora/">Task 1 — LUMORA</a></p>
            <p><a href="./portfolio/">Task 2 — Personal Portfolio</a></p>
          </body>
          </html>
          EOF

      - name: Upload OIBSIP Projects
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4