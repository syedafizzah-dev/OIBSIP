name: Deploy OIBSIP Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site/lumora
          mkdir -p _site/portfolio

          cp -r Web-Development-Level-1-Landing-Page/LUMORA/. _site/lumora/
          cp -r WebDev-L1-PersonalPortfolio/. _site/portfolio/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>OIBSIP | Web Development & Designing</title>

            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }

              body {
                font-family: Arial, Helvetica, sans-serif;
                background: #0b0d12;
                color: #ffffff;
                min-height: 100vh;
              }

              .container {
                width: min(1100px, 90%);
                margin: auto;
              }

              header {
                padding: 70px 0 45px;
                text-align: center;
              }

              .badge {
                display: inline-block;
                padding: 8px 16px;
                border: 1px solid #444;
                border-radius: 30px;
                font-size: 13px;
                letter-spacing: 1px;
                color: #b8b8b8;
                margin-bottom: 22px;
              }

              h1 {
                font-size: clamp(38px, 6vw, 68px);
                line-height: 1.05;
                margin-bottom: 18px;
              }

              .subtitle {
                max-width: 650px;
                margin: auto;
                color: #a8adb7;
                font-size: 17px;
                line-height: 1.7;
              }

              .projects {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 25px;
                padding: 35px 0 70px;
              }

              .card {
                background: #14171e;
                border: 1px solid #292d36;
                border-radius: 20px;
                padding: 30px;
                transition: transform 0.3s ease, border-color 0.3s ease;
              }

              .card:hover {
                transform: translateY(-7px);
                border-color: #666;
              }

              .number {
                color: #858b98;
                font-size: 14px;
                margin-bottom: 18px;
                letter-spacing: 1px;
              }

              .card h2 {
                font-size: 27px;
                margin-bottom: 12px;
              }

              .card p {
                color: #a8adb7;
                line-height: 1.6;
                margin-bottom: 25px;
              }

              .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 25px;
              }

              .tag {
                background: #20242c;
                color: #c5c8ce;
                padding: 6px 10px;
                border-radius: 6px;
                font-size: 12px;
              }

              .button {
                display: inline-block;
                text-decoration: none;
                color: #0b0d12;
                background: #ffffff;
                padding: 11px 18px;
                border-radius: 8px;
                font-weight: 600;
                font-size: 14px;
                transition: opacity 0.2s ease;
              }

              .button:hover {
                opacity: 0.8;
              }

              footer {
                border-top: 1px solid #20232a;
                text-align: center;
                padding: 25px;
                color: #737984;
                font-size: 13px;
              }

              @media (max-width: 600px) {
                header {
                  padding-top: 50px;
                }

                .projects {
                  padding-bottom: 45px;
                }

                .card {
                  padding: 25px;
                }
              }
            </style>
          </head>

          <body>

            <header>
              <div class="container">
                <div class="badge">OASIS INFOBYTE INTERNSHIP</div>

                <h1>Web Development<br>& Designing</h1>

                <p class="subtitle">
                  A collection of projects developed as part of my
                  OASIS INFOBYTE Web Development & Designing Internship.
                </p>
              </div>
            </header>

            <main class="container">
              <section class="projects">

                <article class="card">
                  <div class="number">LEVEL 1 · TASK 1</div>

                  <h2>LUMORA</h2>

                  <p>
                    A modern, responsive landing page designed and developed
                    using HTML and CSS with a polished user-focused layout.
                  </p>

                  <div class="tags">
                    <span class="tag">HTML</span>
                    <span class="tag">CSS</span>
                    <span class="tag">Responsive Design</span>
                  </div>

                  <a class="button" href="./lumora/">
                    View Project →
                  </a>
                </article>


                <article class="card">
                  <div class="number">LEVEL 1 · TASK 2</div>

                  <h2>Personal Portfolio</h2>

                  <p>
                    A professional personal portfolio showcasing my skills,
                    projects, experience and web development journey.
                  </p>

                  <div class="tags">
                    <span class="tag">HTML</span>
                    <span class="tag">CSS</span>
                    <span class="tag">JavaScript</span>
                  </div>

                  <a class="button" href="./portfolio/">
                    View Project →
                  </a>
                </article>


                <article class="card">
                  <div class="number">LEVEL 1 · TASK 3</div>

                  <h2>Coming Soon</h2>

                  <p>
                    The next OASIS INFOBYTE project will appear here once
                    development is complete.
                  </p>

                  <div class="tags">
                    <span class="tag">Upcoming</span>
                  </div>
                </article>

              </section>
            </main>

            <footer>
              © 2026 Syeda Fizza Saeed · OIBSIP Web Development & Designing
            </footer>

          </body>
          </html>
          EOF

      - name: Upload OIBSIP Projects
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4